server:
  port: 8042


spring:
  application:
    name: stokku-inventory-api

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.format_sql: true

app:
  jwt:
    secret: "change-this-secret-key-stokku-inventory-please-rotate-in-prod-0123456789"
    expiration-ms: 86400000

logging:
  level:
    org.springframework.security: INFO
